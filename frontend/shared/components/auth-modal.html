<!-- Auth Modal - Login / Register -->
<div id="auth-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-green-500 text-2xl" style="font-variation-settings:'FILL' 1">sports_soccer</span>
        <span class="text-xl font-bold text-slate-800 dark:text-white">SahaBul</span>
      </div>
      <button id="auth-modal-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-100 dark:border-slate-700">
      <button id="auth-tab-login"
        class="flex-1 py-4 text-sm font-semibold text-center border-b-2 border-green-500 text-green-600 transition-colors">
        Giriş Yap
      </button>
      <button id="auth-tab-register"
        class="flex-1 py-4 text-sm font-semibold text-center text-slate-500 dark:text-slate-400 hover:text-slate-700 transition-colors">
        Kayıt Ol
      </button>
    </div>

    <!-- Login Form -->
    <form id="auth-login-form" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">E-posta</label>
        <input id="login-email" type="email" required placeholder="ornek@email.com"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Şifre</label>
        <input id="login-password" type="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <button type="submit"
        class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl transition-colors text-sm">
        Giriş Yap
      </button>
      <p class="text-center text-xs text-slate-500 dark:text-slate-400">
        Hesabınız yok mu?
        <button type="button" id="switch-to-register" onclick="document.getElementById('auth-tab-register').click()"
          class="text-green-600 font-medium hover:underline">Kayıt olun</button>
      </p>
    </form>

    <!-- Register Form -->
    <form id="auth-register-form" class="hidden p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Ad Soyad</label>
        <input id="register-name" type="text" required placeholder="Ahmet Yılmaz"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">E-posta</label>
        <input id="register-email" type="email" required placeholder="ornek@email.com"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Telefon <span class="text-slate-400">(opsiyonel)</span></label>
        <input id="register-phone" type="tel" placeholder="0532 123 45 67"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Şifre</label>
        <input id="register-password" type="password" required placeholder="En az 6 karakter"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>
      <button type="submit"
        class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl transition-colors text-sm">
        Kayıt Ol
      </button>
      <p class="text-center text-xs text-slate-500 dark:text-slate-400">
        Zaten hesabınız var mı?
        <button type="button" onclick="document.getElementById('auth-tab-login').click()"
          class="text-green-600 font-medium hover:underline">Giriş yapın</button>
      </p>
    </form>
  </div>
</div>
